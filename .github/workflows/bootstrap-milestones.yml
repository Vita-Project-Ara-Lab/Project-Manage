name: Bootstrap project milestones

on:
  push:
    paths:
      - ".github/workflows/bootstrap-milestones.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing milestones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_milestone() {
            local title="$1"
            local due="$2"
            local description="$3"

            if gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100"               --jq '.[].title' | grep -Fxq "$title"; then
              echo "exists: $title"
              return
            fi

            if [ -n "$due" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/milestones"                 -f title="$title"                 -f description="$description"                 -f due_on="$due" >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/milestones"                 -f title="$title"                 -f description="$description" >/dev/null
            fi

            echo "created: $title"
          }

          # DCON2027
          ensure_milestone             "DCON2027｜エントリー提出締切"             "2026-09-30T04:00:00Z"             "公式締切: 2026年9月30日(水) 13:00 JST。\nhttps://dcon.ai/entry/"

          ensure_milestone             "DCON2027｜一次審査結果発表"             "2026-10-11T14:59:59Z"             "公式日程: 2026年10月中旬（予定）。プロジェクト管理上の暫定日として10月11日を設定。\nhttps://dcon.ai/entry/#toc9"

          ensure_milestone             "DCON2027｜プロトタイプ提出締切"             "2027-01-01T14:59:59Z"             "公式日程: 2027年1月上旬（予定）。プロジェクト管理上の暫定日として1月1日を設定。\nhttps://dcon.ai/entry/"

          ensure_milestone             "DCON2027｜二次審査結果発表"             "2027-01-11T14:59:59Z"             "公式日程: 2027年1月中旬〜下旬（予定）。プロジェクト管理上の暫定日として1月11日を設定。\nhttps://dcon.ai/entry/#toc10"

          ensure_milestone             "DCON2027｜三次審査結果発表"             "2027-02-01T14:59:59Z"             "公式日程: 2027年2月上旬〜中旬（予定）。プロジェクト管理上の暫定日として2月1日を設定。\nhttps://dcon.ai/entry/#toc76"

          ensure_milestone             "DCON2027｜本選プレゼン準備"             ""             "本選に向けたプレゼン・展示・デモ準備。公式な開始日は未定のため、期限は未設定。"

          ensure_milestone             "DCON2027｜技術審査会"             "2027-05-14T14:59:59Z"             "技術審査会: 2027年5月14日(金)。\nhttps://dcon.ai/entry/#toc11"

          ensure_milestone             "DCON2027｜本選プレゼン・作品展示"             "2027-05-15T14:59:59Z"             "本選プレゼン・作品展示: 2027年5月15日(土)。\nhttps://dcon.ai/entry/#toc11"

          # GCON2026
          ensure_milestone             "GCON2026｜本エントリー提出締切"             "2026-10-09T14:59:00Z"             "本エントリー提出締切: 2026年10月9日 23:59 JST。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜書類審査"             "2026-10-01T14:59:59Z"             "公式日程: 2026年10月上旬〜中旬。プロジェクト管理上の暫定日として期間の最初の10月1日を設定。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜面談審査対象チーム通知"             "2026-10-11T14:59:59Z"             "公式日程: 2026年10月中旬。プロジェクト管理上の暫定日として10月11日を設定。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜面談審査"             "2026-10-21T14:59:59Z"             "公式日程: 2026年10月下旬。プロジェクト管理上の暫定日として10月21日を設定。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜ファイナリスト発表"             "2026-11-01T14:59:59Z"             "公式日程: 2026年11月上旬。プロジェクト管理上の暫定日として11月1日を設定。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜本選前日イベント"             "2026-12-13T14:59:59Z"             "本選前日午後に、開会式・オリエンテーション・関係者/協賛企業向けポスターセッションを開催予定。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"

          ensure_milestone             "GCON2026｜本選"             "2026-12-14T14:59:59Z"             "本選: 2026年12月14日(月)。\nhttps://www.kosen-k.go.jp/wp/wp-content/uploads/2026/05/GCON2026_bosyu.pdf"
