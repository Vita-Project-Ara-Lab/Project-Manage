name: Sync MVP project schedule

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/project-schedule.yml"

permissions:
  contents: read
  issues: read

jobs:
  sync-project-schedule:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      ORG: Vita-Project-Ara-Lab
      PROJECT_NUMBER: "2"
      REPO: Vita-Project-Ara-Lab/Project-Manage

    steps:
      - name: Check project token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Repository secret PROJECT_TOKEN is required. It must have access to organization Project #2."
            exit 1
          fi

      - name: Ensure project fields
        shell: bash
        run: |
          set -euo pipefail

          ensure_date_field() {
            local field_name="$1"
            local found
            found="$(gh project field-list "$PROJECT_NUMBER" --owner "$ORG" --format json --jq ".fields[] | select(.name == \"$field_name\") | .id" || true)"
            if [ -z "$found" ]; then
              gh project field-create "$PROJECT_NUMBER" --owner "$ORG" --name "$field_name" --data-type DATE >/dev/null
              echo "Created field: $field_name"
            fi
          }

          ensure_date_field "Start date"
          ensure_date_field "Target date"

          iteration_field_id="$(gh project field-list "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.fields[] | select(.name == "MVP Iteration") | .id' || true)"
          if [ -z "$iteration_field_id" ]; then
            project_id="$(gh project view "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.id')"

            jq -n --arg projectId "$project_id" '{
              query: "mutation($input: CreateProjectV2FieldInput!) { createProjectV2Field(input: $input) { projectV2Field { ... on ProjectV2IterationField { id name } } } }",
              variables: {
                input: {
                  projectId: $projectId,
                  name: "MVP Iteration",
                  dataType: "ITERATION",
                  iterationConfiguration: {
                    startDate: "2026-10-12",
                    duration: 7,
                    iterations: [
                      {title: "I1", startDate: "2026-10-12", duration: 7},
                      {title: "I2", startDate: "2026-10-19", duration: 7},
                      {title: "I3", startDate: "2026-10-26", duration: 7},
                      {title: "I4", startDate: "2026-11-02", duration: 7},
                      {title: "I5", startDate: "2026-11-09", duration: 7},
                      {title: "I6", startDate: "2026-11-16", duration: 7},
                      {title: "I7", startDate: "2026-11-23", duration: 7},
                      {title: "G1", startDate: "2026-12-01", duration: 6},
                      {title: "G2", startDate: "2026-12-07", duration: 6}
                    ]
                  }
                }
              }
            }' | gh api graphql --input - >/dev/null

            echo "Created field: MVP Iteration"
          fi

      - name: Apply issue periods and iterations
        shell: bash
        run: |
          set -euo pipefail

          read_iteration_id() {
            local iteration_title="$1"
            gh api graphql \
              -f query='query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2IterationField {
                          name
                          configuration {
                            iterations {
                              id
                              title
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
              -F org="$ORG" \
              -F number="$PROJECT_NUMBER" \
              --jq ".data.organization.projectV2.fields.nodes[]
                    | select(.name == \"MVP Iteration\")
                    | .configuration.iterations[]
                    | select(.title == \"$iteration_title\")
                    | .id"
          }

          issues="$(gh issue list --repo "$REPO" --state all --limit 100 --json number,title,url)"

          echo "$issues" | jq -c '.[]' | while read -r issue; do
            number="$(echo "$issue" | jq -r '.number')"
            title="$(echo "$issue" | jq -r '.title')"
            url="$(echo "$issue" | jq -r '.url')"
            prefix="$(printf '%s' "$title" | sed -n 's/^\[\([^]]*\)\].*/\1/p')"

            case "$prefix" in
              I1) start="2026-10-12"; target="2026-10-18"; iteration="I1" ;;
              I2) start="2026-10-19"; target="2026-10-25"; iteration="I2" ;;
              I3) start="2026-10-26"; target="2026-11-01"; iteration="I3" ;;
              I4) start="2026-11-02"; target="2026-11-08"; iteration="I4" ;;
              I5) start="2026-11-09"; target="2026-11-15"; iteration="I5" ;;
              I6) start="2026-11-16"; target="2026-11-22"; iteration="I6" ;;
              I7) start="2026-11-23"; target="2026-11-29"; iteration="I7" ;;
              G1) start="2026-12-01"; target="2026-12-06"; iteration="G1" ;;
              G2) start="2026-12-07"; target="2026-12-12"; iteration="G2" ;;
              *) continue ;;
            esac

            # MVP Freeze is due on 11/30 even though it belongs to I7.
            if [ "$number" = "48" ]; then
              target="2026-11-30"
            fi

            gh project item-add "$PROJECT_NUMBER" --owner "$ORG" --url "$url" >/dev/null 2>&1 || true

            gh project item-edit "$PROJECT_NUMBER" --owner "$ORG" --url "$url" \
              --field "Start date" --date "$start" >/dev/null

            gh project item-edit "$PROJECT_NUMBER" --owner "$ORG" --url "$url" \
              --field "Target date" --date "$target" >/dev/null

            iteration_id="$(read_iteration_id "$iteration")"
            if [ -z "$iteration_id" ]; then
              echo "::error::Iteration not found: $iteration"
              exit 1
            fi

            gh project item-edit "$PROJECT_NUMBER" --owner "$ORG" --url "$url" \
              --field "MVP Iteration" --iteration-id "$iteration_id" >/dev/null

            echo "#$number $prefix $start -> $target"
          done
