name: Sync MVP project schedule

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/project-schedule.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync-project-schedule:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      ORG: Vita-Project-Ara-Lab
      PROJECT_NUMBER: "2"
      REPO: Vita-Project-Ara-Lab/Project-Manage

    steps:
      - name: Check project token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_TOKEN:-}" ]; then
            echo "::error::Repository secret PROJECT_TOKEN is required."
            exit 1
          fi

      - name: Wait for GraphQL quota if needed
        shell: bash
        run: |
          set -euo pipefail

          rate_json="$(GH_TOKEN="$PROJECT_TOKEN" gh api rate_limit)"
          remaining="$(echo "$rate_json" | jq -r '.resources.graphql.remaining')"
          reset_epoch="$(echo "$rate_json" | jq -r '.resources.graphql.reset')"
          now_epoch="$(date +%s)"

          echo "GraphQL remaining: $remaining"

          if [ "$remaining" -lt 300 ]; then
            wait_seconds=$((reset_epoch - now_epoch + 10))
            if [ "$wait_seconds" -gt 0 ] && [ "$wait_seconds" -le 3700 ]; then
              echo "GraphQL quota is low. Waiting ${wait_seconds}s for reset."
              sleep "$wait_seconds"
            else
              echo "::error::GraphQL quota is too low and reset time could not be safely awaited."
              exit 1
            fi
          fi

      - name: Ensure project iteration field
        shell: bash
        run: |
          set -euo pipefail

          iteration_field_id="$(GH_TOKEN="$PROJECT_TOKEN" gh project field-list "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.fields[] | select(.name == "MVP Iteration") | .id' || true)"
          if [ -z "$iteration_field_id" ]; then
            project_id="$(GH_TOKEN="$PROJECT_TOKEN" gh project view "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.id')"

            jq -n --arg projectId "$project_id" '{
              query: "mutation($input: CreateProjectV2FieldInput!) { createProjectV2Field(input: $input) { projectV2Field { ... on ProjectV2IterationField { id name } } } }",
              variables: {
                input: {
                  projectId: $projectId,
                  name: "MVP Iteration",
                  dataType: "ITERATION",
                  iterationConfiguration: {
                    startDate: "2026-10-12",
                    duration: 7,
                    iterations: [
                      {title: "I1", startDate: "2026-10-12", duration: 7},
                      {title: "I2", startDate: "2026-10-19", duration: 7},
                      {title: "I3", startDate: "2026-10-26", duration: 7},
                      {title: "I4", startDate: "2026-11-02", duration: 7},
                      {title: "I5", startDate: "2026-11-09", duration: 7},
                      {title: "I6", startDate: "2026-11-16", duration: 7},
                      {title: "I7", startDate: "2026-11-23", duration: 7},
                      {title: "G1", startDate: "2026-12-01", duration: 6},
                      {title: "G2", startDate: "2026-12-07", duration: 6}
                    ]
                  }
                }
              }
            }' | GH_TOKEN="$PROJECT_TOKEN" gh api graphql --input - >/dev/null

            echo "Created field: MVP Iteration"
          else
            echo "MVP Iteration already exists"
          fi

      - name: Resolve organization issue date fields
        shell: bash
        run: |
          set -euo pipefail

          start_field_id="$(GH_TOKEN="$PROJECT_TOKEN" gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/$ORG/issue-fields?per_page=100"             --jq '.[] | select(.name == "Start date" and .data_type == "date") | .id' | head -n1)"

          target_field_id="$(GH_TOKEN="$PROJECT_TOKEN" gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/$ORG/issue-fields?per_page=100"             --jq '.[] | select(.name == "Target date" and .data_type == "date") | .id' | head -n1)"

          if [ -z "$start_field_id" ] || [ -z "$target_field_id" ]; then
            echo "::error::Organization issue fields 'Start date' and/or 'Target date' were not found."
            exit 1
          fi

          echo "START_FIELD_ID=$start_field_id" >> "$GITHUB_ENV"
          echo "TARGET_FIELD_ID=$target_field_id" >> "$GITHUB_ENV"

      - name: Cache project IDs and current iteration assignments
        shell: bash
        run: |
          set -euo pipefail

          GH_TOKEN="$PROJECT_TOKEN" gh api graphql             -f query='query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 100) {
                    nodes {
                      ... on ProjectV2IterationField {
                        id
                        name
                        configuration {
                          iterations {
                            id
                            title
                          }
                        }
                      }
                    }
                  }
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                          url
                        }
                      }
                      fieldValueByName(name: "MVP Iteration") {
                        ... on ProjectV2ItemFieldIterationValue {
                          iterationId
                          title
                        }
                      }
                    }
                  }
                }
              }
            }'             -F org="$ORG"             -F number="$PROJECT_NUMBER" > /tmp/project.json

          project_id="$(jq -r '.data.organization.projectV2.id' /tmp/project.json)"
          iteration_field_id="$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name == "MVP Iteration") | .id' /tmp/project.json)"

          if [ -z "$project_id" ] || [ "$project_id" = "null" ] || [ -z "$iteration_field_id" ] || [ "$iteration_field_id" = "null" ]; then
            echo "::error::Could not resolve Project or MVP Iteration field."
            exit 1
          fi

          echo "PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "ITERATION_FIELD_ID=$iteration_field_id" >> "$GITHUB_ENV"

      - name: Apply only missing issue periods and iterations
        shell: bash
        run: |
          set -euo pipefail

          iteration_id_for() {
            local title="$1"
            jq -r --arg title "$title" '
              .data.organization.projectV2.fields.nodes[]
              | select(.name == "MVP Iteration")
              | .configuration.iterations[]
              | select(.title == $title)
              | .id
            ' /tmp/project.json
          }

          issues="$(GH_TOKEN="$REPO_TOKEN" gh issue list --repo "$REPO" --state all --limit 100 --json number,title,url)"

          echo "$issues" | jq -c '.[]' | while read -r issue; do
            number="$(echo "$issue" | jq -r '.number')"
            title="$(echo "$issue" | jq -r '.title')"
            url="$(echo "$issue" | jq -r '.url')"
            prefix="$(printf '%s' "$title" | sed -n 's/^\[\([^]]*\)\].*/\1/p')"

            case "$prefix" in
              I1) start="2026-10-12"; target="2026-10-18"; iteration="I1" ;;
              I2) start="2026-10-19"; target="2026-10-25"; iteration="I2" ;;
              I3) start="2026-10-26"; target="2026-11-01"; iteration="I3" ;;
              I4) start="2026-11-02"; target="2026-11-08"; iteration="I4" ;;
              I5) start="2026-11-09"; target="2026-11-15"; iteration="I5" ;;
              I6) start="2026-11-16"; target="2026-11-22"; iteration="I6" ;;
              I7) start="2026-11-23"; target="2026-11-29"; iteration="I7" ;;
              G1) start="2026-12-01"; target="2026-12-06"; iteration="G1" ;;
              G2) start="2026-12-07"; target="2026-12-12"; iteration="G2" ;;
              *) continue ;;
            esac

            if [ "$number" = "48" ]; then
              target="2026-11-30"
            fi

            item_id="$(jq -r --argjson number "$number" '
              .data.organization.projectV2.items.nodes[]
              | select(.content.number == $number)
              | .id
            ' /tmp/project.json | head -n1)"

            current_iteration="$(jq -r --argjson number "$number" '
              .data.organization.projectV2.items.nodes[]
              | select(.content.number == $number)
              | .fieldValueByName.title // ""
            ' /tmp/project.json | head -n1)"

            if [ -n "$item_id" ] && [ "$item_id" != "null" ] && [ "$current_iteration" = "$iteration" ]; then
              echo "#$number $prefix already synced; skip"
              continue
            fi

            jq -n               --argjson start_id "$START_FIELD_ID"               --argjson target_id "$TARGET_FIELD_ID"               --arg start "$start"               --arg target "$target"               '{
                issue_field_values: [
                  {field_id: $start_id, value: $start},
                  {field_id: $target_id, value: $target}
                ]
              }'               | GH_TOKEN="$REPO_TOKEN" gh api                   --method POST                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2026-03-10"                   "/repos/$REPO/issues/$number/issue-field-values"                   --input -                   --silent

            if [ -z "$item_id" ] || [ "$item_id" = "null" ]; then
              item_id="$(GH_TOKEN="$PROJECT_TOKEN" gh project item-add "$PROJECT_NUMBER" --owner "$ORG" --url "$url" --format json --jq '.id')"
            fi

            iteration_id="$(iteration_id_for "$iteration")"
            if [ -z "$iteration_id" ] || [ "$iteration_id" = "null" ]; then
              echo "::error::Iteration not found: $iteration"
              exit 1
            fi

            GH_TOKEN="$PROJECT_TOKEN" gh project item-edit               --id "$item_id"               --project-id "$PROJECT_ID"               --field-id "$ITERATION_FIELD_ID"               --iteration-id "$iteration_id"               >/dev/null

            echo "#$number $prefix $start -> $target"
            sleep 0.25
          done
